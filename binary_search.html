<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尋找消失的數字 - 偵探遊戲</title>
    <!-- 引入 Tailwind CSS (美化樣式) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Lucide Icons (圖示) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* 定義動畫 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.3s ease-out forwards;
        }
        
        /* 二分搜尋法動畫 */
        @keyframes binary-search {
            0% { width: 100%; opacity: 1; }
            15% { width: 100%; opacity: 1; }
            20%, 35% { width: 50%; opacity: 0.9; }
            40%, 55% { width: 25%; opacity: 0.8; }
            60%, 75% { width: 12.5%; opacity: 0.7; }
            80%, 95% { width: 5%; background-color: #10b981; opacity: 1; }
            100% { width: 100%; opacity: 0; }
        }
        .animate-binary-search {
            animation: binary-search 4s infinite ease-in-out;
        }

        /* 自定義樣式 */
        .grid-btn {
            transition: all 0.3s ease;
        }
        .grid-btn:active {
            transform: scale(0.95);
        }
        
        /* 統一控制項樣式 */
        .control-box {
            height: 4rem; /* h-16 */
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 p-2 sm:p-4 min-h-screen flex flex-col items-center transition-colors duration-500" id="body-bg">

    <!-- Header -->
    <header class="w-full max-w-4xl mb-4 text-center">
        <h1 id="header-title" class="text-2xl sm:text-3xl font-bold mb-1 flex items-center justify-center gap-2 text-indigo-600 transition-colors">
            <i data-lucide="help-circle" class="w-6 h-6 sm:w-8 sm:h-8" id="header-icon"></i>
            <span id="title-text">尋找消失的數字</span>
        </h1>
        <p id="header-desc" class="text-sm sm:text-base text-slate-500">數字連續排列，你能看出少了哪一個嗎？</p>
    </header>

    <!-- Setup Screen -->
    <div id="setup-screen" class="bg-white p-6 sm:p-8 rounded-2xl shadow-xl w-full max-w-md border-2 border-indigo-100 mt-4 animate-fade-in">
        <div class="flex items-center gap-2 mb-6 text-indigo-600">
            <i data-lucide="settings" class="w-6 h-6"></i>
            <h2 class="text-xl font-bold">遊戲設定</h2>
        </div>
        
        <div class="space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-2">起始數字</label>
                    <input type="number" id="input-min" value="1" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-lg font-medium">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-2">結束數字</label>
                    <input type="number" id="input-max" value="100" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-lg font-medium">
                </div>
            </div>
            
            <div id="setup-error" class="hidden p-3 bg-red-50 text-red-600 rounded-lg text-sm flex items-center gap-2 animate-pulse">
                <i data-lucide="x-circle" class="w-4 h-4"></i>
                <span id="setup-error-msg"></span>
            </div>

            <button onclick="game.startGame()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2 text-lg">
                <i data-lucide="play" class="w-6 h-6"></i>
                開始生成題目
            </button>
        </div>
    </div>

    <!-- Game Screen (Hidden by default) -->
    <div id="game-screen" class="hidden w-fit mx-auto max-w-full flex flex-col gap-4 animate-fade-in">
        
        <!-- Controls & Input Area (Grid Layout for Alignment) -->
        <div class="w-full grid grid-cols-1 md:grid-cols-2 gap-4 items-start">
            
            <!-- Left Column: Range & Investigate Controls -->
            <div class="flex flex-col gap-4">
                
                <!-- 1. Top Bar: Range & Reset (Height Fixed) -->
                <div class="control-box bg-white px-4 rounded-xl shadow-sm border border-slate-200 justify-between">
                    <div class="flex items-center gap-2 text-sm sm:text-base">
                        <span class="text-slate-500 font-medium">範圍:</span>
                        <span id="display-range" class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full font-bold">1 - 100</span>
                    </div>
                    <button onclick="game.resetGame()" class="text-slate-500 hover:text-indigo-600 flex items-center gap-2 text-sm font-medium transition-colors">
                        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                        重設
                    </button>
                </div>

                <!-- Preview Timer (Shown only during preview) -->
                <div id="preview-timer" class="hidden control-box w-full bg-indigo-600 text-white px-4 rounded-xl font-bold justify-center gap-3 shadow-lg animate-pulse">
                    <i data-lucide="timer" class="w-6 h-6"></i>
                    <span class="text-xl">記憶時間：<span id="timer-count">3</span> 秒</span>
                </div>

                <!-- 2. Investigate Toggle (Height Fixed) -->
                <div id="investigate-controls" class="hidden w-full">
                    <div class="flex gap-2 h-16">
                        <button id="btn-toggle-investigate" onclick="game.toggleInvestigateMode()" class="flex-1 rounded-xl font-bold flex items-center justify-center gap-2 transition-all shadow-sm border-2 bg-white border-slate-200 text-slate-600 hover:bg-slate-50 h-full">
                            <i data-lucide="search" class="w-5 h-5"></i>
                            <span>開啟偵探線索模式</span>
                        </button>
                        
                        <button id="btn-toggle-blind" onclick="game.toggleBlindMode()" class="hidden px-4 rounded-xl border-2 flex items-center justify-center transition-all bg-slate-800 text-white border-slate-800 h-full" title="顯示/隱藏數字">
                             <i id="icon-blind" data-lucide="eye-off" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right Column: Stats & Input Area -->
            <div id="input-section" class="w-full flex flex-col gap-4">
                
                <!-- 3. Investigate Stats (Height Fixed) -->
                <div id="investigate-stats" class="hidden control-box bg-white px-4 rounded-xl border border-slate-200 shadow-sm animate-fade-in justify-between">
                    <div class="flex items-center gap-2 text-slate-600 text-sm">
                        <i data-lucide="microscope" class="w-4 h-4"></i>
                        <span>已檢查: <span id="step-count">0</span></span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-sm font-bold text-rose-600">剩餘安全次數:</span>
                        <span id="steps-left" class="px-3 py-0.5 rounded-full font-mono font-bold shadow-sm min-w-[2rem] text-center text-white bg-slate-400">
                            0
                        </span>
                    </div>
                </div>

                <!-- 4. Input Area (Height Fixed) -->
                <form onsubmit="game.handleCheck(event)" class="w-full">
                    <div id="input-container" class="control-box bg-white border-indigo-100 px-2 rounded-xl shadow-xl border-2 transition-colors">
                        <input type="number" id="user-guess" placeholder="輸入數字..." class="flex-1 px-4 text-lg outline-none bg-transparent placeholder-slate-400 font-bold text-slate-700 disabled:text-slate-400 h-full">
                        
                        <!-- Submit Button -->
                        <button type="submit" id="btn-submit" class="bg-indigo-600 hover:bg-indigo-700 text-white p-2.5 rounded-full shadow-md transition-all hover:scale-105 active:scale-95 flex-shrink-0">
                            <i data-lucide="check-circle" class="w-5 h-5"></i>
                        </button>

                        <!-- Status Badges (Hidden by default) -->
                        <div id="status-badge-won" class="hidden bg-green-500 text-white px-4 py-2 rounded-full font-bold flex items-center gap-1.5 animate-pulse whitespace-nowrap text-sm sm:text-base">
                            <i data-lucide="trophy" class="w-4 h-4"></i> 答對了！
                        </div>
                        <div id="status-badge-revealed" class="hidden bg-amber-500 text-white px-4 py-2 rounded-full font-bold flex items-center gap-1.5 whitespace-nowrap text-sm sm:text-base">
                            <i data-lucide="x-circle" class="w-4 h-4"></i> <span id="reveal-text">答案: ?</span>
                        </div>
                        <div id="status-badge-exploded" class="hidden bg-rose-500 text-white px-4 py-2 rounded-full font-bold flex items-center gap-1.5 whitespace-nowrap text-sm sm:text-base">
                            <i data-lucide="bomb" class="w-4 h-4"></i> BOOM
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Feedback Message (Moved to bottom to avoid misalignment) -->
        <div id="feedback-msg" class="text-center font-bold text-base min-h-[1.5rem] transition-colors duration-300 flex items-center justify-center gap-2 px-4 text-indigo-600">
            <!-- Icon and Text injected via JS -->
        </div>

        <!-- Actions (Restart Button) -->
        <div id="action-area" class="text-center mb-2">
            <button id="btn-restart" onclick="game.resetGame()" class="hidden px-6 py-2.5 rounded-xl font-bold hover:shadow-lg transition-all transform hover:-translate-y-1 flex items-center gap-2 mx-auto text-sm sm:text-base text-white bg-slate-800 hover:bg-slate-700">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i> 重新開始 (回到設定頁)
            </button>
        </div>

        <!-- Number Grid -->
        <div id="grid-container" class="w-full bg-white p-3 rounded-xl shadow-lg border-2 border-slate-200 relative overflow-hidden transition-all duration-500 overflow-x-auto">
            
            <!-- Range Indicator Bar -->
            <div id="range-indicator" class="hidden absolute top-0 left-0 w-full h-1 bg-slate-100 z-10">
                <div id="range-bar" class="h-full bg-rose-500 transition-all duration-500" style="width: 0%; margin-left: 0%;"></div>
            </div>

            <!-- Explosion Overlay -->
            <div id="explosion-overlay" class="hidden absolute inset-0 z-30 flex items-center justify-center bg-white/80 backdrop-blur-sm animate-fade-in">
                <div class="text-center">
                    <i data-lucide="flame" class="w-16 h-16 text-rose-600 mx-auto mb-2 animate-bounce"></i>
                    <div class="text-2xl font-bold text-rose-700">BOOM!</div>
                </div>
            </div>

            <!-- The Grid -->
            <div id="number-grid" class="grid gap-1 justify-center">
                <!-- Numbers will be injected here -->
            </div>
        </div>
    </div>

    <!-- Tutorial Modal -->
    <div id="tutorial-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-fade-in">
        <div class="bg-white rounded-2xl p-6 sm:p-8 max-w-lg w-full shadow-2xl relative overflow-hidden border-2 border-indigo-100 transform transition-all scale-100">
            
            <div class="absolute top-0 right-0 w-32 h-32 bg-indigo-50 rounded-bl-full -z-10 opacity-50"></div>
            
            <button onclick="game.resetGame()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 transition-colors bg-white rounded-full p-1">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>

            <h3 class="text-2xl font-bold text-indigo-600 mb-4 flex items-center gap-2">
                <i data-lucide="book-open" class="w-8 h-8 text-indigo-500"></i>
                <span id="modal-title-text">你發現了「二分搜尋法」！</span>
            </h3>

            <div class="bg-slate-50 rounded-xl p-6 mb-5 border border-slate-100 relative overflow-hidden flex flex-col items-center justify-center gap-2">
                <div class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">搜尋過程視覺化</div>
                <div class="w-full h-8 bg-indigo-100 rounded-full relative overflow-hidden shadow-inner">
                    <div class="absolute top-0 left-0 h-full bg-indigo-500 w-full animate-binary-search origin-left"></div>
                </div>
                <div class="flex justify-between w-full text-xs text-slate-400 font-mono mt-1 px-1">
                    <span>0%</span><span>50%</span><span>100%</span>
                </div>
            </div>

            <div class="space-y-4 text-slate-600">
                <p id="modal-intro" class="leading-relaxed">
                    <!-- Text will be injected via JS -->
                </p>
                <div id="explanation-box" class="bg-indigo-50 p-4 rounded-lg border border-indigo-100 text-sm">
                    <h4 id="explanation-title" class="font-bold text-indigo-700 mb-1 flex items-center gap-1">
                        <i data-lucide="chevron-right" class="w-4 h-4"></i> 什麼是二分搜尋法?
                    </h4>
                    <p id="explanation-text" class="text-indigo-800/80">
                        不管範圍多大，只要每次都從<strong>中間</strong>切一半，剩下的範圍就會瞬間變得很小。
                        就像把電話簿從中間翻開，就能馬上排除掉一半的頁數！
                    </p>
                </div>
                <p id="explanation-tip" class="text-sm text-slate-500 italic">💡 知識點：即使有 1,000,000 個數字，用這個方法也只需要約 20 次就能找到目標！</p>
            </div>

            <button onclick="game.resetGame()" class="w-full mt-6 bg-indigo-600 text-white py-3.5 rounded-xl font-bold hover:bg-indigo-700 hover:shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2">
                <i data-lucide="trophy" class="w-5 h-5"></i> <span id="modal-btn-text">我學會了，重新開始！</span>
            </button>
        </div>
    </div>

    <script>
        // Game Logic
        const game = {
            state: 'setup', // setup, preview, playing, won, revealed, exploded
            config: { min: 1, max: 100 },
            numbers: [],
            missingNumber: null,
            steps: 0,
            maxSteps: 0,
            optimalSteps: 0,
            isInvestigateMode: false,
            isBlindMode: false,
            inspectedIndices: new Set(),
            searchRange: { startIdx: 0, endIdx: 0 },
            previewTimer: null,
            
            init() {
                lucide.createIcons();
            },

            startGame() {
                const minInput = document.getElementById('input-min').value;
                const maxInput = document.getElementById('input-max').value;
                
                if (parseInt(minInput) >= parseInt(maxInput)) {
                    this.showMessage('起始數字必須小於結束數字！', 'error');
                    return;
                }

                this.config.min = parseInt(minInput);
                this.config.max = parseInt(maxInput);
                const count = this.config.max - this.config.min + 1;

                // Generate full range
                const fullRange = Array.from({ length: count }, (_, i) => this.config.min + i);
                
                // Pick random to remove
                const randomIndex = Math.floor(Math.random() * fullRange.length);
                this.missingNumber = fullRange[randomIndex];
                
                // Remove the number
                this.numbers = fullRange.filter(n => n !== this.missingNumber);
                
                // Calc steps
                this.optimalSteps = Math.ceil(Math.log2(count));
                this.maxSteps = this.optimalSteps + 5;

                // Reset state
                this.steps = 0;
                this.isInvestigateMode = false;
                this.isBlindMode = false;
                this.inspectedIndices.clear();
                this.searchRange = { startIdx: 0, endIdx: this.numbers.length - 1 };

                // UI Reset
                document.getElementById('user-guess').value = '';
                this.toggleScreen('game');
                
                // Reset UI to clean state before preview
                this.updateInputUI(); 

                // Start Preview
                this.startPreview();
            },

            startPreview() {
                this.state = 'preview';
                this.updateHeader();
                
                const timerEl = document.getElementById('preview-timer');
                const timerCount = document.getElementById('timer-count');
                const investigateControls = document.getElementById('investigate-controls');
                
                timerEl.classList.remove('hidden');
                investigateControls.classList.add('hidden');
                
                // Hide stats initially during preview
                document.getElementById('investigate-stats').classList.add('hidden');

                this.renderGrid();
                this.updateInputUI(); // Ensure input is disabled/clean during preview
                this.showMessage('請把握 3 秒鐘觀察數字範圍！', 'info');

                let timeLeft = 3;
                timerCount.innerText = timeLeft;

                this.previewTimer = setInterval(() => {
                    timeLeft--;
                    timerCount.innerText = timeLeft;
                    if (timeLeft <= 0) {
                        clearInterval(this.previewTimer);
                        this.startPlaying();
                    }
                }, 1000);
            },

            startPlaying() {
                this.state = 'playing';
                this.isInvestigateMode = true;
                this.isBlindMode = true;
                
                document.getElementById('preview-timer').classList.add('hidden');
                document.getElementById('investigate-controls').classList.remove('hidden');
                document.getElementById('investigate-stats').classList.remove('hidden'); // Show stats now
                
                this.updateHeader();
                this.updateInvestigateUI();
                this.renderGrid();
                this.updateInputUI(); // Enable input
                
                // Removed the message display as requested
                this.showMessage('', '');
                
                lucide.createIcons();
            },

            handleNumberClick(num, idx) {
                if (this.state !== 'playing') return;

                if (this.isInvestigateMode) {
                    if (!this.inspectedIndices.has(idx)) {
                        this.steps++;
                        this.inspectedIndices.add(idx);
                        this.updateInvestigateStats();

                        if (this.steps > this.maxSteps) {
                            this.explode();
                            return;
                        }
                    }

                    // Binary Logic
                    const expectedVal = this.config.min + idx;
                    
                    if (num === expectedVal) {
                        this.searchRange.startIdx = Math.max(this.searchRange.startIdx, idx + 1);
                        this.showMessage(`🔍 檢查第 ${idx + 1} 格：數字是 ${num} (符合預期)。缺號在後面！`, 'info');
                    } else {
                        this.searchRange.endIdx = Math.min(this.searchRange.endIdx, idx - 1);
                        this.showMessage(`🔍 檢查第 ${idx + 1} 格：數字是 ${num} (預期 ${expectedVal})。缺號在前面！`, 'warning');
                    }
                    
                    this.renderGrid();
                    this.updateRangeBar();
                } else {
                    document.getElementById('user-guess').value = num;
                }
            },

            handleCheck(e) {
                e.preventDefault();
                const input = document.getElementById('user-guess');
                if (!input.value) return;
                
                const guess = parseInt(input.value);
                
                if (guess === this.missingNumber) {
                    this.gameWon();
                } else {
                    this.showMessage('再試試看！不是這個數字喔。', 'error');
                    const form = document.getElementById('input-container');
                    form.classList.add('animate-shake');
                    setTimeout(() => form.classList.remove('animate-shake'), 500);
                }
            },

            gameWon() {
                this.state = 'won';
                this.restoreNumber();
                this.renderGrid();
                this.updateInputUI();
                this.updateHeader();
                this.showMessage(`太棒了！你用了 ${this.steps} 次檢查就找到了答案！ 🎉`, 'success');

                // Prepare Modal Content
                const titleEl = document.getElementById('modal-title-text');
                const introEl = document.getElementById('modal-intro');
                const btnTextEl = document.getElementById('modal-btn-text');
                
                // Explanation Elements
                const explainTitle = document.getElementById('explanation-title');
                const explainText = document.getElementById('explanation-text');
                const explainTip = document.getElementById('explanation-tip');

                if (this.steps > 0) {
                    if (this.steps <= this.optimalSteps) {
                        // Perfect Case
                        titleEl.innerText = '你發現了「二分搜尋法」！';
                        introEl.innerHTML = `太厲害了！你只用了 <span class="font-bold text-indigo-600 text-lg">${this.steps}</span> 次檢查就找到了答案。<br>這比電腦科學中著名的<strong>最佳次數 (${this.optimalSteps} 次)</strong> 還要快或一樣快！`;
                        
                        explainTitle.innerHTML = `<i data-lucide="book-open" class="w-4 h-4"></i> 什麼是二分搜尋法?`;
                        explainText.innerHTML = `不管範圍多大，只要每次都從<strong>中間</strong>切一半，剩下的範圍就會瞬間變得很小。<br>就像把電話簿從中間翻開，就能馬上排除掉一半的頁數！`;
                        explainTip.style.display = 'block';
                        
                        btnTextEl.innerText = '我學會了，重新開始！';
                    } else {
                        // Hint Case (Not giving away the answer, just hints)
                        titleEl.innerText = '挑戰成功！但似乎還有更快的捷徑？';
                        introEl.innerHTML = `恭喜過關！你這次用了 <span class="font-bold text-amber-600 text-lg">${this.steps}</span> 次檢查。<br>其實這道題最少只需要 <strong>${this.optimalSteps} 次</strong> 就能保證找到答案喔！`;
                        
                        explainTitle.innerHTML = `<i data-lucide="lightbulb" class="w-4 h-4"></i> 解謎線索`;
                        explainText.innerHTML = `看看上方的動畫，每一次搜尋範圍是怎麼變化的？<br>試著觀察藍色條「變短的方式」，下次試試看模仿這個策略！`;
                        explainTip.style.display = 'none'; // Hide the explicit tip to keep the mystery
                        
                        btnTextEl.innerText = '好，我再試一次！';
                    }
                    // Show Modal
                    document.getElementById('tutorial-modal').classList.remove('hidden');
                    lucide.createIcons(); // Refresh icons
                }
            },

            explode() {
                this.state = 'exploded';
                this.restoreNumber();
                this.renderGrid();
                this.updateInputUI();
                this.updateHeader();
                
                document.getElementById('body-bg').classList.remove('bg-slate-50');
                document.getElementById('body-bg').classList.add('bg-red-50');
                
                document.getElementById('grid-container').classList.add('border-rose-400', 'shadow-rose-200');
                document.getElementById('explosion-overlay').classList.remove('hidden');
                
                this.showMessage('💥 轟！操作次數過多，觸發地雷爆炸了！', 'error');
                lucide.createIcons();
            },

            restoreNumber() {
                 if (!this.numbers.includes(this.missingNumber)) {
                    this.numbers.push(this.missingNumber);
                    this.numbers.sort((a, b) => a - b);
                 }
                 // Reset range to show full board
                 this.searchRange = { startIdx: 0, endIdx: this.numbers.length };
                 this.isBlindMode = false; // Reveal all
            },

            resetGame() {
                this.state = 'setup';
                clearInterval(this.previewTimer);
                
                // Reset styles
                document.getElementById('body-bg').classList.add('bg-slate-50');
                document.getElementById('body-bg').classList.remove('bg-red-50');
                document.getElementById('grid-container').classList.remove('border-rose-400', 'shadow-rose-200');
                document.getElementById('explosion-overlay').classList.add('hidden');
                document.getElementById('tutorial-modal').classList.add('hidden');
                document.getElementById('range-indicator').classList.add('hidden');
                document.getElementById('investigate-stats').classList.add('hidden'); // Hide stats on reset
                
                this.toggleScreen('setup');
                this.showMessage('', '');
                this.updateHeader();
            },

            // --- UI Helpers ---

            toggleInvestigateMode() {
                this.isInvestigateMode = !this.isInvestigateMode;
                if(this.isInvestigateMode) this.isBlindMode = true;
                this.updateInvestigateUI();
                this.renderGrid();
                this.showMessage('', '');
                lucide.createIcons();
            },

            toggleBlindMode() {
                this.isBlindMode = !this.isBlindMode;
                this.updateInvestigateUI();
                this.renderGrid();
                lucide.createIcons();
            },

            updateInvestigateUI() {
                const btn = document.getElementById('btn-toggle-investigate');
                const btnBlind = document.getElementById('btn-toggle-blind');
                const stats = document.getElementById('investigate-stats');
                const rangeBar = document.getElementById('range-indicator');

                if (this.isInvestigateMode) {
                    btn.className = "flex-1 rounded-xl font-bold flex items-center justify-center gap-2 transition-all shadow-sm border-2 bg-rose-50 border-rose-300 text-rose-700 ring-2 ring-rose-200 h-full";
                    btn.innerHTML = `<i data-lucide="bomb" class="w-5 h-5 animate-pulse"></i> 偵探模式 (已開啟)`;
                    
                    btnBlind.classList.remove('hidden');
                    rangeBar.classList.remove('hidden');
                    
                    document.getElementById('icon-blind').setAttribute('data-lucide', this.isBlindMode ? 'eye-off' : 'eye');
                    if (this.isBlindMode) {
                        btnBlind.className = "px-4 rounded-xl border-2 flex items-center justify-center transition-all bg-slate-800 text-white border-slate-800 h-full";
                    } else {
                        btnBlind.className = "px-4 rounded-xl border-2 flex items-center justify-center transition-all bg-white text-slate-400 border-slate-200 h-full";
                    }
                } else {
                    btn.className = "flex-1 rounded-xl font-bold flex items-center justify-center gap-2 transition-all shadow-sm border-2 bg-white border-slate-200 text-slate-600 hover:bg-slate-50 h-full";
                    btn.innerHTML = `<i data-lucide="search" class="w-5 h-5"></i> 開啟偵探線索模式`;
                    
                    btnBlind.classList.add('hidden');
                    rangeBar.classList.add('hidden');
                }
                this.updateInvestigateStats();
            },

            updateInvestigateStats() {
                document.getElementById('step-count').innerText = this.steps;
                const left = Math.max(0, this.maxSteps - this.steps);
                const leftEl = document.getElementById('steps-left');
                leftEl.innerText = left;
                
                if (left <= 3) {
                    leftEl.className = "px-3 py-0.5 rounded-full font-mono font-bold shadow-sm min-w-[2rem] text-center text-white bg-rose-600 animate-pulse";
                } else {
                    leftEl.className = "px-3 py-0.5 rounded-full font-mono font-bold shadow-sm min-w-[2rem] text-center text-white bg-slate-400";
                }
            },

            updateRangeBar() {
                const total = this.numbers.length;
                const width = ((this.searchRange.endIdx - this.searchRange.startIdx + 1) / total) * 100;
                const left = (this.searchRange.startIdx / total) * 100;
                const bar = document.getElementById('range-bar');
                bar.style.width = `${width}%`;
                bar.style.marginLeft = `${left}%`;
            },

            toggleScreen(screenName) {
                const setup = document.getElementById('setup-screen');
                const game = document.getElementById('game-screen');
                
                if (screenName === 'setup') {
                    setup.classList.remove('hidden');
                    game.classList.add('hidden');
                } else {
                    setup.classList.add('hidden');
                    game.classList.remove('hidden');
                    // Update range text
                    document.getElementById('display-range').innerText = `${this.config.min} - ${this.config.max}`;
                }
            },

            updateHeader() {
                const title = document.getElementById('title-text');
                const icon = document.getElementById('header-icon');
                const desc = document.getElementById('header-desc');
                const h1 = document.getElementById('header-title');

                if (this.state === 'exploded') {
                    h1.className = "text-2xl sm:text-3xl font-bold mb-1 flex items-center justify-center gap-2 text-red-600 transition-colors";
                    icon.setAttribute('data-lucide', 'flame');
                    title.innerText = "任務失敗：地雷爆炸";
                    desc.innerText = "你檢查了太多次，觸發了警報系統！";
                } else {
                    h1.className = "text-2xl sm:text-3xl font-bold mb-1 flex items-center justify-center gap-2 text-indigo-600 transition-colors";
                    icon.setAttribute('data-lucide', 'help-circle');
                    title.innerText = "尋找消失的數字";
                    
                    if (this.state === 'preview') desc.innerText = "快記住數字分佈！";
                    else if (this.isInvestigateMode) {
                        desc.innerText = this.isBlindMode ? "數字已隱藏！請點擊格子檢查，找出規律斷裂處。" : "注意！點擊次數有限，請謹慎選擇檢查點！";
                    } else {
                        desc.innerText = "數字連續排列，你能看出少了哪一個嗎？";
                    }
                }
                lucide.createIcons();
            },

            updateInputUI() {
                const input = document.getElementById('user-guess');
                const btnSubmit = document.getElementById('btn-submit');
                const badgeWon = document.getElementById('status-badge-won');
                const badgeRev = document.getElementById('status-badge-revealed');
                const badgeExp = document.getElementById('status-badge-exploded');
                // Removed btnGiveup reference
                const btnRestart = document.getElementById('btn-restart');
                
                // 1. 強制隱藏所有標籤
                badgeWon.classList.add('hidden');
                badgeRev.classList.add('hidden');
                badgeExp.classList.add('hidden');

                const isPlaying = this.state === 'playing';
                const isPreview = this.state === 'preview';

                if (isPlaying) {
                    input.disabled = false;
                    input.placeholder = "輸入數字...";
                    btnSubmit.classList.remove('hidden');
                    btnRestart.classList.add('hidden');
                } else if (isPreview) {
                    input.disabled = true;
                    input.placeholder = "記憶中...";
                    btnSubmit.classList.add('hidden');
                    btnRestart.classList.add('hidden');
                } else {
                    // Game Over states (won, revealed, exploded)
                    input.disabled = true;
                    input.placeholder = "遊戲結束";
                    btnSubmit.classList.add('hidden');
                    btnRestart.classList.remove('hidden');
                    
                    // 只在狀態符合時才顯示對應標籤
                    if (this.state === 'won') badgeWon.classList.remove('hidden');
                    if (this.state === 'revealed') {
                        document.getElementById('reveal-text').innerText = `答案: ${this.missingNumber}`;
                        badgeRev.classList.remove('hidden');
                    }
                    if (this.state === 'exploded') badgeExp.classList.remove('hidden');
                }
                lucide.createIcons();
            },

            showMessage(text, type) {
                const el = document.getElementById('feedback-msg');
                el.innerText = text;
                el.className = `text-center font-bold text-base min-h-[1.5rem] mb-2 transition-colors duration-300 flex items-center justify-center gap-2 px-4 animate-fade-in`;
                
                if (type === 'success') el.classList.add('text-green-600');
                else if (type === 'error') el.classList.add('text-rose-600');
                else if (type === 'warning') el.classList.add('text-amber-600');
                else el.classList.add('text-indigo-600');
                
                // Add icon if needed (simplified)
            },

            renderGrid() {
                const container = document.getElementById('number-grid');
                container.innerHTML = '';
                
                // Set grid template with extra column for line number
                // 3.5rem for line number, then 9 columns of 3.5rem
                container.style.gridTemplateColumns = '3.5rem repeat(9, 3.5rem)'; 

                // Create a DocumentFragment to batch DOM insertions for performance
                const fragment = document.createDocumentFragment();

                let rowCount = 1;

                this.numbers.forEach((num, idx) => {
                    // Inject Row Number before the first element of each row
                    if (idx % 9 === 0) {
                        const rowNum = document.createElement('div');
                        rowNum.className = "flex items-center justify-center text-slate-400 font-mono text-sm font-bold border-r-2 border-slate-100 mr-2";
                        rowNum.innerText = rowCount++;
                        fragment.appendChild(rowNum);
                    }

                    const btn = document.createElement('button');
                    
                    // State Checks
                    const isMissing = (this.state === 'won' || this.state === 'revealed' || this.state === 'exploded') && num === this.missingNumber;
                    const isEliminated = this.isInvestigateMode && (idx < this.searchRange.startIdx || idx > this.searchRange.endIdx);
                    const isInspected = this.inspectedIndices.has(idx);
                    
                    // Logic for content
                    let content = num;
                    if (this.state === 'playing' && this.isInvestigateMode && this.isBlindMode && !isInspected) {
                        content = '?';
                    }
                    btn.innerText = content;
                    
                    // Responsive font size logic
                    const str = content.toString();
                    let fontSize = 'text-xl sm:text-2xl'; // Base size for 1-2 digits
                    if (str.length === 3) fontSize = 'text-lg sm:text-xl';
                    if (str.length === 4) fontSize = 'text-base sm:text-lg';
                    if (str.length === 5) fontSize = 'text-sm sm:text-base';
                    if (str.length === 6) fontSize = 'text-xs sm:text-sm';
                    if (str.length >= 7) fontSize = 'text-[10px] sm:text-xs tracking-tighter';

                    // Base Classes
                    let classes = `grid-btn aspect-square flex items-center justify-center ${fontSize} font-bold rounded-md relative `;
                    
                    // Conditional Styling
                    if (this.state !== 'playing') btn.disabled = true;
                    else btn.onclick = () => this.handleNumberClick(num, idx);

                    if (isEliminated) {
                        classes += "opacity-20 grayscale cursor-not-allowed bg-slate-100 text-slate-400 border border-slate-200";
                    } else if (isMissing) {
                        classes += "transform scale-110 shadow-lg ring-2 ring-offset-1 z-20 ";
                        if (this.state === 'won') classes += "bg-green-500 text-white ring-green-300";
                        else if (this.state === 'exploded') classes += "bg-rose-600 text-white ring-rose-400 animate-pulse";
                        else classes += "bg-amber-500 text-white ring-amber-300";
                    } else if (this.isInvestigateMode && this.state === 'playing') {
                        if (content === '?') {
                            classes += "bg-indigo-600 text-white shadow-md hover:bg-indigo-700 active:scale-95";
                        } else {
                            classes += "bg-white text-indigo-700 border-2 border-indigo-200";
                        }
                    } else {
                        classes += "bg-slate-50 text-slate-700 hover:bg-slate-100 border border-slate-200";
                    }
                    
                    btn.className = classes;
                    fragment.appendChild(btn);
                });
                
                // Append the entire fragment at once
                container.appendChild(fragment);
            }
        };

        // Start
        game.init();
    </script>
</body>
</html>
